<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Tells the browser to honor system color preferences for the initial
     paint (scrollbar, form controls, and a sensible body bg) before our
     CSS loads. Kills the white flash on dark-mode launch. -->
<meta name="color-scheme" content="light dark">
<style>
  /* Match the page's --bg variable at first paint so the body doesn't
     flash white in dark mode. The full stylesheet immediately below
     overrides this; this is just to color the initial blank canvas. */
  html { background: #fafaf7; }
  @media (prefers-color-scheme: dark) { html { background: #161613; } }
</style>
<title>Memory Map</title>
<link rel="icon" type="image/png" sizes="512x512" href="/favicon.png">
<link rel="apple-touch-icon" sizes="512x512" href="/favicon.png">
<script>/*__MARKED__*/</script>
<style>/*__CSS__*/</style>
</head>
<body>
<header>
  <h1>Memory Map</h1>
  <p class="lede">
    Every custom skill, agent, slash command, and persistent memory file in your Claude setup.
    Pick a tab, click a name to see the file rendered on the right.
  </p>
  <div class="controls">
    <div class="nav-actions">
      <button class="nav-btn nav-back" id="nav-back" title="Back (⌘[)" aria-label="Back" disabled>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11 3 L5 8 L11 13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="nav-btn nav-forward" id="nav-forward" title="Forward (⌘])" aria-label="Forward" disabled>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3 L11 8 L5 13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <input class="search" id="search" type="search" placeholder="Filter by name or description…">
    <button class="chip" data-kind="skills" aria-pressed="false">skills</button>
    <button class="chip" data-kind="agents" aria-pressed="false">agents</button>
    <button class="chip" data-kind="commands" aria-pressed="false">commands</button>
    <button class="chip" data-kind="memory" aria-pressed="false">memory</button>
    <button class="chip" data-kind="hook" aria-pressed="false">hooks</button>
    <button class="chip" data-kind="routine" aria-pressed="false">routines</button>
    <button class="chip" data-kind="plan" aria-pressed="false">plans</button>
    <div class="settings-wrap">
      <button class="gear-btn" id="gear-btn" title="Settings" aria-label="Settings">
        <svg class="gear-glyph" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
      <div class="settings-menu" id="settings-menu" role="menu">
        <button id="regen-btn" role="menuitem">
          <span class="menu-icon"><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8a5.5 5.5 0 0 1 9.4-3.9M13.5 8a5.5 5.5 0 0 1-9.4 3.9"/><path d="M11.5 1.5v3h-3M4.5 14.5v-3h3"/></svg></span>
          <span>Regenerate directory</span>
        </button>
        <div class="menu-divider"></div>
        <button id="pick-workspace-btn" role="menuitem">
          <span class="menu-icon"><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.5a1 1 0 0 1 1-1h3l1.5 1.5H13a1 1 0 0 1 1 1V12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"/></svg></span>
          <span>Choose workspace folder…</span>
        </button>
        <button id="pick-data-btn" role="menuitem">
          <span class="menu-icon"><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2.5h5l3 3V13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1z"/><path d="M9 2.5v3h3"/></svg></span>
          <span>Use external data file…</span>
        </button>
        <button id="allow-tmp-btn" role="menuitem">
          <span class="menu-icon"><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.5a1 1 0 0 1 1-1h3l1.5 1.5H13a1 1 0 0 1 1 1V12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"/><path d="M8 7.5v3M6.5 9h3"/></svg></span>
          <span>Allow files in /tmp…</span>
        </button>
        <div class="menu-divider"></div>
        <button id="about-btn" role="menuitem">
          <span class="menu-icon"><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M8 11V7.5M8 5v.5"/></svg></span>
          <span>About Memory Map</span>
        </button>
        <button id="shortcuts-btn" role="menuitem">
          <span class="menu-icon"><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="4" width="13" height="8" rx="1.5"/><path d="M4 7h.01M7 7h.01M10 7h.01M13 7h.01M4 10h.01M7 10h2M11 10h.01"/></svg></span>
          <span>Keyboard shortcuts</span>
        </button>
        <button id="hooks-btn" role="menuitem">
          <span class="menu-icon"><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2 4 9h3l-1 5 5-7H8z"/></svg></span>
          <span>Suggested hooks</span>
        </button>
        <div class="menu-divider"></div>
        <button id="reset-config-btn" role="menuitem" class="muted">
          <span class="menu-icon"><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2v3h-3"/></svg></span>
          <span>Reset to defaults</span>
        </button>
      </div>
    </div>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="global" aria-selected="true">Global <span class="tab-count">–</span></button>
    <button class="tab" role="tab" data-tab="memory" aria-selected="false">Memory <span class="tab-count">–</span></button>
    <button class="tab" role="tab" data-tab="workspace" aria-selected="false">Workspace <span class="tab-count">–</span></button>
    <button class="tab" role="tab" data-tab="automations" aria-selected="false">Automations <span class="tab-count">–</span></button>
    <button class="tab" role="tab" data-tab="plugins" aria-selected="false">Plugins <span class="tab-count">–</span></button>
  </div>
</header>

<main>
  <div class="pane left">
    <div class="tree-pane active" data-tab="global"><div class="tree"></div></div>
    <div class="tree-pane" data-tab="memory"><div class="tree"></div></div>
    <div class="tree-pane" data-tab="workspace"><div class="tree"></div></div>
    <div class="tree-pane" data-tab="automations"><div class="tree"></div></div>
    <div class="tree-pane" data-tab="plugins"><div class="tree"></div></div>
  </div>
  <div class="splitter" id="splitter" role="separator" aria-orientation="vertical"></div>
  <div class="pane right" id="detail">
    <div class="detail-empty">Select a file on the left to view it here.</div>
  </div>
</main>

<div id="modal-backdrop" class="modal-backdrop" hidden>
  <div class="modal" id="modal-card" role="dialog" aria-modal="true">
    <button class="modal-close" id="modal-close" aria-label="Close">×</button>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div id="find-bar" class="find-bar" hidden>
  <input type="search" id="find-input" class="find-input" placeholder="Find in page…" autocomplete="off">
  <span class="find-count" id="find-count" aria-live="polite"></span>
  <button class="find-btn" id="find-prev" title="Previous (⇧↵)" aria-label="Previous">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 10 L8 6 L12 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="find-btn" id="find-next" title="Next (↵)" aria-label="Next">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6 L8 10 L12 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="find-btn find-close" id="find-close" title="Close (Esc)" aria-label="Close">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 5 L11 11 M11 5 L5 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>
</div>

<script>/*__DATA__*/</script>
<script>/*__APP_JS__*/</script>
</body>
</html>
