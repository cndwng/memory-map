<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memory Map</title>
<link rel="icon" type="image/png" sizes="512x512" href="/favicon.png">
<link rel="apple-touch-icon" sizes="512x512" href="/favicon.png">
<script>/*__MARKED__*/</script>
<style>/*__CSS__*/</style>
</head>
<body>
<header>
  <h1>Memory Map</h1>
  <p class="lede">
    Every custom skill, agent, slash command, and persistent memory file in your Claude setup.
    Pick a tab, click a name to see the file rendered on the right.
  </p>
  <div class="controls">
    <div class="nav-actions">
      <button class="nav-btn nav-back" id="nav-back" title="Back (⌘[)" aria-label="Back" disabled>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11 3 L5 8 L11 13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="nav-btn nav-forward" id="nav-forward" title="Forward (⌘])" aria-label="Forward" disabled>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3 L11 8 L5 13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <input class="search" id="search" type="search" placeholder="Filter by name or description…">
    <button class="chip" data-kind="skills" aria-pressed="false">skills</button>
    <button class="chip" data-kind="agents" aria-pressed="false">agents</button>
    <button class="chip" data-kind="commands" aria-pressed="false">commands</button>
    <button class="chip" data-kind="memory" aria-pressed="false">memory</button>
    <button class="chip" data-kind="hook" aria-pressed="false">hooks</button>
    <button class="chip" data-kind="routine" aria-pressed="false">routines</button>
    <button class="chip" data-kind="plan" aria-pressed="false">plans</button>
    <div class="settings-wrap">
      <button class="gear-btn" id="gear-btn" title="Settings"><span class="gear-glyph">⚙</span></button>
      <div class="settings-menu" id="settings-menu" role="menu">
        <button id="regen-btn" role="menuitem">↻ Regenerate directory</button>
        <div class="menu-divider"></div>
        <button id="pick-workspace-btn" role="menuitem">📂 Choose workspace folder…</button>
        <button id="pick-data-btn" role="menuitem">📄 Use external data file…</button>
        <div class="menu-divider"></div>
        <button id="about-btn" role="menuitem">ℹ️ About Memory Map</button>
        <button id="hooks-btn" role="menuitem">🪝 Suggested hooks</button>
        <div class="menu-divider"></div>
        <button id="reset-config-btn" role="menuitem" class="muted">↺ Reset to defaults</button>
      </div>
    </div>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="global" aria-selected="true">Global <span class="tab-count">–</span></button>
    <button class="tab" role="tab" data-tab="memory" aria-selected="false">Memory <span class="tab-count">–</span></button>
    <button class="tab" role="tab" data-tab="workspace" aria-selected="false">Workspace <span class="tab-count">–</span></button>
    <button class="tab" role="tab" data-tab="automations" aria-selected="false">Automations <span class="tab-count">–</span></button>
    <button class="tab" role="tab" data-tab="plugins" aria-selected="false">Plugins <span class="tab-count">–</span></button>
  </div>
</header>

<main>
  <div class="pane left">
    <div class="tree-pane active" data-tab="global"><div class="tree"></div></div>
    <div class="tree-pane" data-tab="memory"><div class="tree"></div></div>
    <div class="tree-pane" data-tab="workspace"><div class="tree"></div></div>
    <div class="tree-pane" data-tab="automations"><div class="tree"></div></div>
    <div class="tree-pane" data-tab="plugins"><div class="tree"></div></div>
  </div>
  <div class="splitter" id="splitter" role="separator" aria-orientation="vertical"></div>
  <div class="pane right" id="detail">
    <div class="detail-empty">Select a file on the left to view it here.</div>
  </div>
</main>

<div id="modal-backdrop" class="modal-backdrop" hidden>
  <div class="modal" id="modal-card" role="dialog" aria-modal="true">
    <button class="modal-close" id="modal-close" aria-label="Close">×</button>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div id="find-bar" class="find-bar" hidden>
  <input type="search" id="find-input" class="find-input" placeholder="Find in page…" autocomplete="off">
  <span class="find-count" id="find-count" aria-live="polite"></span>
  <button class="find-btn" id="find-prev" title="Previous (⇧↵)" aria-label="Previous">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 10 L8 6 L12 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="find-btn" id="find-next" title="Next (↵)" aria-label="Next">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6 L8 10 L12 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="find-btn find-close" id="find-close" title="Close (Esc)" aria-label="Close">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 5 L11 11 M11 5 L5 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>
</div>

<script>/*__DATA__*/</script>
<script>/*__APP_JS__*/</script>
</body>
</html>
